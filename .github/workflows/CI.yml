name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}-${{ matrix.backend }}-capi=${{ matrix.capi }}-codec=${{ matrix.codec || 'all' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false #${{ !( startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') ) }}
      matrix:
        os:
          - macos-14  # arm64
          - macos-13  # x86_64
          - windows-latest
          - ubuntu-latest
        # Every codec with a pure-Rust implementation is tested with both
        # backends; see "Select features" below for the mapping.
        backend:
          - c
          - pure
        capi:
          - true
          - false
        codec:
          - zstd
          - blosc2
          - gzip
          - brotli
          - lz4
          - xz
          - deflate
          - bzip2
          - null  # Use all codecs

        exclude:
          # No pure-Rust backend for these (brotli/snappy are Rust already).
          - backend: pure
            codec: blosc2
          - backend: pure
            codec: brotli

          # TODO: codecs not implemented in capi feature
          - capi: true
            codec: blosc2
          - capi: true
            codec: xz
          - capi: true
            codec: deflate

          # TODO: capi feature fails with all enabled due to duplicate export of 'compress' symbol
          # first from the capi here, then from blosc2 internal zlib-ng; probably just rename ours
          # prefixed with 'cramjam_' or something.
          # (The pure-Rust all-codecs build has no blosc2, so it's unaffected.)
          - backend: c
            capi: true
            codec: null
            os: ubuntu-latest
          - backend: c
            capi: true
            codec: null
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        name: Rust Cache

      - name: Install nasm
        if: runner.os != 'macOS'
        uses: ilammy/setup-nasm@v1

      # A system liblzma makes lzma-sys (xz2's backend) link the full,
      # all-filters library instead of building a reduced vendored one, so the
      # integration step's xz BCJ cross-impl tests have a complete reference.
      - name: Install liblzma (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev

      - name: Install build deps (OSX)
        if: runner.os == 'macOS'
        run: brew install automake autoconf coreutils libtool nasm

      - name: Set MSVC developer prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.6.0

      - name: Audit
        if: |
          !matrix.codec && matrix.capi
        run: cargo install cargo-audit && cargo audit

      # FEATURES: the cargo feature flags for this backend/codec cell.
      #   c,    codec X -> --no-default-features --features X
      #   c,    all     -> (default features)
      #   pure, codec X -> --no-default-features --features X-pure
      #                    (gzip/deflate -> deflate-pure, which also covers zlib)
      #   pure, all     -> --no-default-features --features pure-rust,snappy,brotli
      #                    (a pure-Rust-only build: no C codec is compiled)
      - name: Select features
        shell: bash
        run: |
          codec="${{ matrix.codec }}"
          if [ "${{ matrix.backend }}" = pure ]; then
            case "$codec" in
              "")            f="--no-default-features --features pure-rust,snappy,brotli" ;;
              gzip|deflate)  f="--no-default-features --features deflate-pure" ;;
              *)             f="--no-default-features --features ${codec}-pure" ;;
            esac
          else
            if [ -z "$codec" ]; then f=""; else f="--no-default-features --features $codec"; fi
          fi
          if [ "${{ matrix.capi }}" = true ]; then f="$f --features capi"; fi
          echo "FEATURES=$f" >> "$GITHUB_ENV"
          echo "LIBCRAMJAM_EXPECT_BACKEND=${{ matrix.backend }}" >> "$GITHUB_ENV"
          echo "features: $f"

      - name: Unit tests
        run: cargo test -p libcramjam --lib ${{ env.FEATURES }}

      # A pure-Rust-only build must not pull in any C codec library.
      - name: No C codec dependencies in the pure-Rust build
        if: matrix.backend == 'pure' && !matrix.codec && !matrix.capi
        shell: bash
        run: |
          sys=$(cargo tree -p libcramjam -e normal --prefix none ${{ env.FEATURES }} | grep -E -- '-sys v' | sort -u || true)
          if [ -n "$sys" ]; then echo "unexpected C dependencies:"; echo "$sys"; exit 1; fi

      # Integration tests (tests/*.rs): the backend contract (public API vs
      # the reference C crates, identical for both backends), cross-impl
      # round-trips, corpus ratio + round-trip on real data, and streaming
      # semantics. These must run in --release (the codecs are far too slow
      # in debug). The xz ones need a full liblzma (all BCJ filters) — which
      # lzma-sys links only from a system library, available on Linux
      # (installed above) but not under msvc, which always builds a reduced
      # vendored liblzma. So this runs on Linux; every platform still gets
      # full unit-test (`--lib`) coverage above. The `#[ignore]`d full-corpus
      # tests are left for the nightly/manual fuzz+corpus runs.
      - name: Integration tests (release, all codecs)
        if: |
          !matrix.capi && !matrix.codec && runner.os == 'Linux'
        run: cargo test -p libcramjam --release --tests ${{ env.FEATURES }}

      # Cargo unifies features across a dependency graph, so a user can end
      # up with both a C codec feature and its `-pure` one; the pure-Rust
      # backend must win and still pass the contract.
      - name: Contract tests with C and pure-Rust features both enabled
        if: |
          matrix.backend == 'pure' && !matrix.capi && !matrix.codec && runner.os == 'Linux'
        run: cargo test -p libcramjam --release --test backend_contract --features pure-rust

