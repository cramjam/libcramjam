name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}-capi=${{ matrix.capi }}-codec=${{ matrix.codec || 'all' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false #${{ !( startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') ) }}
      matrix:
        os:
          - macos-14  # arm64
          - macos-13  # x86_64
          - windows-latest
          - ubuntu-latest
        capi:
          - true
          - false
        codec:
          - zstd
          - blosc2
          - gzip
          - brotli
          - lz4
          - xz
          - deflate
          - bzip2
          - null  # Use all codecs

        # TODO: codecs not implemented in capi feature
        exclude:
          - capi: true
            codec: blosc2
          - capi: true
            codec: xz
          - capi: true
            codec: deflate

          # TODO: capi feature fails with all enabled due to duplicate export of 'compress' symbol
          # first from the capi here, then from blosc2 internal zlib-ng; probably just rename ours
          # prefixed with 'cramjam_' or something.
          - capi: true
            codec: null
            os: ubuntu-latest
          - capi: true
            codec: null
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        name: Rust Cache

      - name: Install nasm
        if: runner.os != 'macOS'
        uses: ilammy/setup-nasm@v1

      # A system liblzma makes lzma-sys (xz2's backend) link the full,
      # all-filters library instead of building a reduced vendored one, so the
      # integration step's xz BCJ cross-impl tests have a complete reference.
      - name: Install liblzma (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev

      - name: Install build deps (OSX)
        if: runner.os == 'macOS'
        run: brew install automake autoconf coreutils libtool nasm

      - name: Set MSVC developer prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.6.0

      - name: Audit
        if: |
          !matrix.codec && matrix.capi
        run: cargo install cargo-audit && cargo audit

      - name: Test capi and single codec
        if: matrix.capi && matrix.codec
        run: cargo test -p libcramjam --no-default-features --features ${{ matrix.codec }} --features capi --lib

      - name: Test capi and all codecs
        if: matrix.capi && !matrix.codec
        run: cargo test -p libcramjam --features capi --lib

      - name: Test no capi and all codecs
        if: |
          !matrix.capi && !matrix.codec
        run: cargo test -p libcramjam --lib

      - name: Test no capi and single codec
        if: |
          !matrix.capi && matrix.codec
        run: cargo test -p libcramjam --lib --no-default-features --features ${{ matrix.codec }}

      # Integration tests (tests/*.rs): cross-impl round-trips, corpus ratio +
      # round-trip on real data, and streaming semantics. These are the real
      # validation and must run in --release (the codecs are far too slow in
      # debug). They compare against the C reference crates, and the xz ones
      # need a full liblzma (all BCJ filters) — which lzma-sys links only from
      # a system library, available on Linux (installed above) but not under
      # msvc, which always builds a reduced vendored liblzma. So this runs on
      # Linux; every platform still gets full unit-test (`--lib`) coverage
      # above. The `#[ignore]`d full-corpus tests are left for the
      # nightly/manual fuzz+corpus runs.
      - name: Integration tests (release, all codecs)
        if: |
          !matrix.capi && !matrix.codec && runner.os == 'Linux'
        run: cargo test -p libcramjam --release --tests

